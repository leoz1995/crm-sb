# Perfil de TESTE. Fica em src/test/resources (NAO em main), senao e empacotado
# no jar de producao e alguem pode ativa-lo por acidente.
#
# Banco em memoria: o anterior apontava para o banco de DESENVOLVIMENTO com
# ddl-auto=update, ou seja, rodar teste alterava dado e schema reais.
spring.datasource.url=jdbc:h2:mem:crmtest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

crm.jwt.secret=chave-de-teste-com-no-minimo-32-bytes-ok
crm.jwt.issuer=crm-api-test
crm.jwt.audience=crm-web-test
crm.jwt.access-ttl=15m
crm.cors.origens=http://localhost:5173

logging.level.org.springframework.security=INFO
