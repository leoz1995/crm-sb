spring.application.name=crm
spring.datasource.url=jdbc:mariadb://localhost:3306/crm
spring.datasource.username=developer
spring.datasource.password=1234567

logging.level.org.springframework.security=TRACE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Usa a variavel de ambiente CRM_JWT_SECRET quando existir; o valor apos os ":"
# e apenas um default de DESENVOLVIMENTO. HS256 exige no minimo 32 bytes.
crm.jwt.secret=${CRM_JWT_SECRET:dev-only-troque-esta-chave-com-no-minimo-32-bytes}
