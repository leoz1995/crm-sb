spring.application.name=crm
debug=true
# ===== Banco =====
# Credenciais por variavel de ambiente: o valor apos ":" e default de
# DESENVOLVIMENTO. Em producao, defina as variaveis e nao deixe default.
spring.datasource.url=${CRM_DB_URL:jdbc:mariadb://localhost:3306/crm}
spring.datasource.username=${CRM_DB_USER:developer}
spring.datasource.password=${CRM_DB_PASSWORD:1234567}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Mitiga o custo de qualquer N+1 ainda nao descoberto: em vez de N queries,
# agrupa em lotes com IN (?,?,?...).
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# ===== JWT =====
# A variavel de ambiente vence quando existe. HS256 exige no minimo 32 bytes,
# validado no boot pelo SecurityConfig.
crm.jwt.secret=${CRM_JWT_SECRET:dev-only-troque-esta-chave-com-no-minimo-32-bytes}
crm.jwt.issuer=crm-api
crm.jwt.audience=crm-web
crm.jwt.access-ttl=${CRM_JWT_ACCESS_TTL:2h}

# ===== CORS =====
# Nunca "*" junto com allowCredentials. Liste as origens reais.
crm.cors.origens=${CRM_CORS_ORIGENS:http://localhost:5173,http://localhost:3000}

# ===== Paginacao =====
# Sem max-page-size, "?size=10000000" e um OutOfMemoryError de um curl.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# ===== Limites de payload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
server.max-http-request-header-size=16KB

# ===== Erro =====
server.error.include-stacktrace=never
server.error.include-message=never
server.shutdown=graceful

# ===== Atras de proxy reverso =====
# Sem isto o Location do 201 sai com host interno, o HSTS nao e enviado e
# qualquer rate limit por IP ve apenas o IP do proxy.
# ATENCAO: so habilite quando a aplicacao for inalcancavel sem o proxy,
# senao X-Forwarded-For passa a ser forjavel.
# server.forward-headers-strategy=framework

# ===== Log =====
logging.level.root=INFO
logging.level.br.com.leonardoalves.crm=INFO
