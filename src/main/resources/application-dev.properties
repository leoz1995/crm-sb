# Perfil de DESENVOLVIMENTO. Ative com --spring.profiles.active=dev

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.br.com.leonardoalves.crm=DEBUG
# TRACE loga detalhe de cada filtro e, em alguns caminhos, conteudo de token.
# Fica SO aqui, nunca no application.properties.
logging.level.org.springframework.security=TRACE
logging.level.org.hibernate.SQL=DEBUG

# Imprime o Condition Evaluation Report: mostra qual bean seu desligou qual
# auto-configuracao do Boot.
debug=true
